spring.application.name=my_rag

# ===== Elasticsearch（向量库连接。注意：9200 是 ES 本体端口，5601 是 Kibana）=====
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.username=elastic
spring.elasticsearch.password=iSD9HFf0

# ===== Spring AI Elasticsearch 向量库 =====
spring.ai.vectorstore.elasticsearch.initialize-schema=true
spring.ai.vectorstore.elasticsearch.index-name=my_rag_docs
spring.ai.vectorstore.elasticsearch.dimensions=1024
spring.ai.vectorstore.elasticsearch.similarity=cosine

# ===== DeepSeek API（对话模型，OpenAI 兼容，通过 Spring AI 的 OpenAI 模块调用）=====
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.api-key=sk-f73b333962884ba08490622c10a291d3
spring.ai.openai.chat.options.model=deepseek-chat
# 禁用 OpenAI 模块自动生成的 embedding（DeepSeek 没有 embedding 接口，向量由百炼提供）
spring.ai.openai.embedding.enabled=false

# ===== 阿里云百炼 DashScope（向量嵌入，OpenAI 兼容）=====
# 注意：Spring AI M4 会自动在 base-url 后面拼 /v1/embeddings，
# 所以这里只能写到 compatible-mode，不能带 /v1，否则会拼出 /v1/v1 报 404
spring.ai.embedding.dashscope.base-url=https://dashscope.aliyuncs.com/compatible-mode
spring.ai.embedding.dashscope.api-key=sk-ws-H.EPRLMPX.rXJf.MEUCIQDnqYXzzDsKz9WQ1Kw-L5pwlzKVKFSbSwzHAHJQmUQKAgIgAwQfeN8RihBtSfSlyyLNs1yyMV6w1mmiFpQnTdWE-Ro
spring.ai.embedding.dashscope.model=text-embedding-v3

# ===== 文件上传大小限制（默认单文件 1MB，知识库 PDF 常超限）=====
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
